<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Типи дротів</title>
</head>
<body>

    <h1>Типи дротів</h1>

    <table border="1" cellpadding="5">
        <thead>
            <tr>
                <th>ID</th>
                <th>Тип дроту</th>
            </tr>
        </thead>
        <tbody>
            {% for type in types %}
                <tr>
                    <td>{{ type.id }}</td>
                    <td>{{ type.name }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="7">Записів не знайдено.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
